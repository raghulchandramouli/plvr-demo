[project]
name = "plvr"
version = "0.1.0"
description = "Reproduce the tau2 Telecom result of CoreThink's PLVR paper with local Qwen3 models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm==0.32.2",
    "tau2",
    "pydantic>=2.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plvr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
